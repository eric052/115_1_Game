<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜拳機器人控制台</title>
<style>
:root{--bg:#eef2e6;--ink:#1f2a44;--card:#fbfcf7;--line:#cdd6bd;--S:#e8505b;--R:#2f6fed;--P:#e9a820;--mute:#6b7690}
@media (prefers-color-scheme:dark){:root{--bg:#161c2c;--ink:#eef2e6;--card:#20283c;--line:#34405c;--mute:#9aa6c2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block;margin-right:6px}
.on .dot{background:#2dbe60}
button{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:translateY(1px)}
button.pri{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--R);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.stage{text-align:center;padding:20px 8px}
#hand{font-size:110px;line-height:1.1;display:inline-block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
#hand.shake{animation:shake .5s ease-in-out infinite}
#hand.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-28px) rotate(8deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.stage.S{box-shadow:inset 0 0 0 3px var(--S)}.stage.R{box-shadow:inset 0 0 0 3px var(--R)}.stage.P{box-shadow:inset 0 0 0 3px var(--P)}
.stage{border-radius:16px;transition:box-shadow .3s}
#state{font-size:17px;font-weight:700;min-height:26px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.meta b{display:block;font-size:20px}.meta span{font-size:12px;color:var(--mute)}
h2{font-size:15px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button.act{background:var(--ink);color:var(--bg)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pick button{font-size:30px;padding:8px}
.pick button.act{border-width:4px}
.pick [data-m=S].act{border-color:var(--S)}.pick [data-m=R].act{border-color:var(--R)}.pick [data-m=P].act{border-color:var(--P)}
.row{display:grid;grid-template-columns:32px 1fr 44px;gap:8px;align-items:center;margin:8px 0}
input[type=range]{width:100%}
.hist{display:flex;gap:6px;flex-wrap:wrap;font-size:26px;min-height:34px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)}
.bar i{display:block;transition:width .4s}
small{color:var(--mute)}
</style>
</head>
<body>
<h1><span id="conn"><span class="dot"></span><span id="connTxt">未連線</span></span>
<button class="pri" id="btnConn">連接藍芽</button></h1>

<div class="card stage" id="stage">
  <div id="hand">✊</div>
  <div id="state">尚未連線</div>
  <div class="meta">
    <div><b id="dist">--</b><span>距離 cm</span></div>
    <div><b id="angle">--</b><span>馬達角度</span></div>
    <div><b id="rounds">0</b><span>出拳次數</span></div>
  </div>
</div>

<div class="card">
  <h2>目前設定</h2>
  <div id="summary">--</div>
  <div class="bar"><i id="b0" style="background:var(--S)"></i><i id="b1" style="background:var(--R)"></i><i id="b2" style="background:var(--P)"></i></div>
  <small id="counts">累計：✌️ 0　✊ 0　✋ 0</small>
  <div class="hist" id="hist"></div>
</div>

<div class="card">
  <h2>出拳模式</h2>
  <div class="seg">
    <button id="mRandom">🎲 隨機（依機率）</button>
    <button id="mForce">📌 指定出拳</button>
  </div>
  <div class="pick" id="pick">
    <button data-m="S">✌️</button><button data-m="R">✊</button><button data-m="P">✋</button>
  </div>
</div>

<div class="card">
  <h2>隨機機率</h2>
  <div class="row"><span>✌️</span><input type="range" id="p0" min="0" max="100" value="33"><b id="v0">33</b></div>
  <div class="row"><span>✊</span><input type="range" id="p1" min="0" max="100" value="34"><b id="v1">34</b></div>
  <div class="row"><span>✋</span><input type="range" id="p2" min="0" max="100" value="33"><b id="v2">33</b></div>
  <small>滑桿數值為權重，送出後會自動換算成百分比。</small>
  <div class="seg" style="margin-top:10px">
    <button id="pReset">平均</button><button class="pri" id="pApply">套用機率</button>
  </div>
</div>

<div class="card">
  <h2>偵測距離：<span id="thv">20</span> cm</h2>
  <input type="range" id="th" min="5" max="60" value="20">
  <button id="play" style="width:100%;margin-top:10px">👊 手動出拳</button>
</div>

<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',CMD='6e400002-b5a3-f393-e0a9-e50e24dcca9e',STA='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const EMO={S:'✌️',R:'✊',P:'✋','-':'✊'}, NAMES={S:'剪刀',R:'石頭',P:'布'};
const $=id=>document.getElementById(id);
let cmdChar=null,dev=null,last=null,prevState='',dirty=false,history=[];

const STATE_TXT={idle:'等待手伸過來…',shake:'剪刀、石頭、…',reveal:'布！',hold:'',wait:'請把手移開'};

async function connect(){
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',onLost);
    const s=await (await dev.gatt.connect()).getPrimaryService(SVC);
    cmdChar=await s.getCharacteristic(CMD);
    const st=await s.getCharacteristic(STA);
    await st.startNotifications();
    st.addEventListener('characteristicvaluechanged',e=>{
      try{onStatus(JSON.parse(new TextDecoder().decode(e.target.value)))}catch(_){}
    });
    setConn(true);
  }catch(err){$('state').textContent='連線失敗：'+err.message}
}
function onLost(){cmdChar=null;setConn(false)}
function setConn(ok){
  $('conn').className=ok?'on':'';$('connTxt').textContent=ok?'已連線 RPS-Robot':'未連線';
  $('btnConn').textContent=ok?'中斷':'連接藍芽';
  if(!ok)$('state').textContent='尚未連線';
}
async function send(t){
  if(!cmdChar){$('state').textContent='請先連接藍芽';return}
  const d=new TextEncoder().encode(t);
  try{await (cmdChar.writeValueWithoutResponse?cmdChar.writeValueWithoutResponse(d):cmdChar.writeValue(d))}
  catch(e){$('state').textContent='傳送失敗：'+e.message}
}

function onStatus(s){
  last=s;
  const hand=$('hand'),stage=$('stage');
  $('dist').textContent=s.d>=999?'--':s.d;
  $('angle').textContent=s.a+'°';
  $('rounds').textContent=s.n;
  $('thv').textContent=s.t; if(document.activeElement!==$('th'))$('th').value=s.t;

  if(s.s!==prevState){
    hand.classList.remove('shake','pop'); void hand.offsetWidth;
    if(s.s==='shake'){hand.textContent='✊';hand.classList.add('shake');stage.className='card stage'}
    else if(s.s==='reveal'||s.s==='hold'){
      hand.textContent=EMO[s.l];
      if(s.s==='reveal')hand.classList.add('pop');
      stage.className='card stage '+s.l;
      if(s.s==='reveal'){history.unshift(s.l);history=history.slice(0,12);$('hist').textContent=history.map(x=>EMO[x]).join(' ')}
    }else if(s.s==='idle'){hand.textContent='✊';stage.className='card stage'}
    prevState=s.s;
  }
  $('state').textContent=s.s==='hold'?'出拳：'+NAMES[s.l]+' '+EMO[s.l]:STATE_TXT[s.s]||s.s;

  const isF=s.m==='F';
  $('mRandom').classList.toggle('act',!isF);$('mForce').classList.toggle('act',isF);
  document.querySelectorAll('#pick button').forEach(b=>b.classList.toggle('act',isF&&b.dataset.m===s.f));
  $('summary').innerHTML=isF?'📌 <b>指定出：'+NAMES[s.f]+' '+EMO[s.f]+'</b>'
    :'🎲 <b>隨機</b>　✌️ '+s.p[0]+'%　✊ '+s.p[1]+'%　✋ '+s.p[2]+'%';
  ['b0','b1','b2'].forEach((id,i)=>$(id).style.width=s.p[i]+'%');
  $('counts').textContent='累計：✌️ '+s.c[0]+'　✊ '+s.c[1]+'　✋ '+s.c[2];
  if(!dirty)[0,1,2].forEach(i=>{$('p'+i).value=s.p[i];$('v'+i).textContent=s.p[i]});
}

$('btnConn').onclick=()=>dev&&dev.gatt.connected?dev.gatt.disconnect():connect();
$('mRandom').onclick=()=>send('MODE:RANDOM');
$('mForce').onclick=()=>send('MODE:FORCE:'+(last&&last.f||'R'));
document.querySelectorAll('#pick button').forEach(b=>b.onclick=()=>send('MODE:FORCE:'+b.dataset.m));
[0,1,2].forEach(i=>$('p'+i).oninput=()=>{dirty=true;$('v'+i).textContent=$('p'+i).value});
$('pApply').onclick=()=>{send('PROB:'+[0,1,2].map(i=>$('p'+i).value).join(','));dirty=false;send('MODE:RANDOM')};
$('pReset').onclick=()=>{[0,1,2].forEach(i=>{$('p'+i).value=33;$('v'+i).textContent=33});dirty=true};
$('th').onchange=()=>send('TH:'+$('th').value);
$('th').oninput=()=>$('thv').textContent=$('th').value;
$('play').onclick=()=>send('PLAY');
if(!navigator.bluetooth)$('state').textContent='此瀏覽器不支援 Web Bluetooth，請用 Android Chrome 或 iOS 的 Bluefy';
</script>
</body>
</html>
