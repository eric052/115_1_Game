<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 猜拳機控制後台</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #222; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: #333; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 5px; transition: 0.3s; }
        button:hover { background: #45a049; }
        input[type="number"] { width: 60px; padding: 5px; border-radius: 5px; border: none; text-align: center; }
        hr { border-color: #555; margin: 20px 0; }
        
        /* 猜拳動畫區域 */
        #hand-display { font-size: 80px; margin: 20px 0; display: inline-block; }
        .shake-animation { animation: shake 0.6s infinite; }
        
        @keyframes shake {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-10deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>🤖 ESP32 猜拳機控制面板</h1>
    
    <div class="card">
        <button id="connectBtn">連接藍牙設備</button>
        <p id="status">狀態：未連接</p>
    </div>

    <div class="card">
        <h3>當前狀態</h3>
        <div id="hand-display">✊</div>
        <h2 id="result-text">等待玩家出拳...</h2>
    </div>

    <div class="card">
        <h3>後台控制</h3>
        <p>強制出拳：</p>
        <button onclick="sendCommand('FORCE:0')">✌️ 必出剪刀</button>
        <button onclick="sendCommand('FORCE:90')">✊ 必出石頭</button>
        <button onclick="sendCommand('FORCE:180')">🖐️ 必出布</button>
        <button onclick="sendCommand('FORCE:-1')" style="background: #2196F3;">🎲 恢復隨機</button>

        <hr>
        
        <p>隨機機率設定 (%)：</p>
        剪刀: <input type="number" id="pS" value="33">
        石頭: <input type="number" id="pR" value="33">
        布: <input type="number" id="pP" value="34">
        <br><br>
        <button onclick="setProbabilities()" style="background: #FF9800;">設定機率</button>
    </div>

<script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 寫入 (對應 ESP32)
    const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 接收 (對應 ESP32 通知)

    let myCharacteristic_RX;

    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            document.getElementById('status').innerText = '狀態：搜尋中...';
            
            // 請求藍牙設備連線，過濾名稱必須符合 ESP32 設定的 "ESP32_RPS"
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_RPS' }],
                optionalServices: [SERVICE_UUID]
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            
            myCharacteristic_RX = await service.getCharacteristic(RX_UUID);
            const characteristicTX = await service.getCharacteristic(TX_UUID);
            
            // 開啟通知以接收 ESP32 傳來的結果
            await characteristicTX.startNotifications();
            characteristicTX.addEventListener('characteristicvaluechanged', handleNotifications);

            document.getElementById('status').innerText = '狀態：🟢 已連接';
            document.getElementById('status').style.color = '#4CAF50';
            
            device.addEventListener('gattserverdisconnected', () => {
                document.getElementById('status').innerText = '狀態：🔴 已斷線';
                document.getElementById('status').style.color = 'red';
            });

        } catch (error) {
            console.error(error);
            document.getElementById('status').innerText = '狀態：連線失敗或使用者取消';
        }
    });

    // 處理 ESP32 回傳的狀態字串
    function handleNotifications(event) {
        let value = new TextDecoder().decode(event.target.value);
        const handDisplay = document.getElementById('hand-display');
        const resultText = document.getElementById('result-text');

        if (value === "START") {
            // ESP32 偵測到手，開始播放搖晃動畫
            handDisplay.innerText = "✊";
            handDisplay.classList.add("shake-animation");
            resultText.innerText = "剪刀、石頭...";
        } 
        else if (value.startsWith("RESULT:")) {
            // ESP32 出拳完畢，停止動畫並顯示結果
            handDisplay.classList.remove("shake-animation");
            let angle = parseInt(value.split(":")[1]);
            
            if (angle === 0) {
                handDisplay.innerText = "✌️";
                resultText.innerText = "出了 剪刀！";
            } else if (angle === 90) {
                handDisplay.innerText = "✊";
                resultText.innerText = "出了 石頭！";
            } else if (angle === 180) {
                handDisplay.innerText = "🖐️";
                resultText.innerText = "出了 布！";
            }
        }
    }

    // 將字串指令透過藍牙發送給 ESP32
    async function sendCommand(cmd) {
        if (!myCharacteristic_RX) {
            alert('請先點擊上方按鈕連接藍牙！');
            return;
        }
        let encoder = new TextEncoder();
        await myCharacteristic_RX.writeValue(encoder.encode(cmd));
        console.log("已發送指令:", cmd);
    }

    // 讀取輸入框數值並組成機率設定指令
    function setProbabilities() {
        let s = parseInt(document.getElementById('pS').value);
        let r = parseInt(document.getElementById('pR').value);
        let p = parseInt(document.getElementById('pP').value);
        
        if (s + r + p !== 100) {
            alert('剪刀、石頭、布的機率總和必須剛好為 100%！');
            return;
        }
        sendCommand(`PROB:${s},${r},${p}`);
        alert('機率設定成功，系統已自動切換回隨機模式！');
    }
</script>

</body>
</html>
